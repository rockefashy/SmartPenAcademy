name: Monitor Render Logs

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: monitor-render-logs
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and Analyze Render Logs
        id: monitor
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          npx tsx scripts/monitor-render-logs.ts --github-action

      - name: Commit Updated Error Log
        if: steps.monitor.outputs.has_errors == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/render-errors.log
          git diff --staged --quiet || (git commit -m "chore(logs): record render runtime errors [skip ci]" && git push)
